name: ci
on:
  pull_request: { branches: [main] }
  push: { branches: [main] }

# Least privilege, pinned rather than inherited: without this the token gets
# whatever the org/repo default grants, so a later default change would silently
# widen this workflow. It only checks out and runs npm, so contents: read is all
# it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
